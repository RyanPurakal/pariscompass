# Local development. Runs without a Gemini key (projections return 503).
# Database defaults match docker-compose.yml.
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/pariscompass}
    username: ${DATABASE_USERNAME:pariscompass}
    password: ${DATABASE_PASSWORD:pariscompass}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ryanpurakal.pariscompass: DEBUG
