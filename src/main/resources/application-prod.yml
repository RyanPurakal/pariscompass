# Production. No defaults for deployment-specific values: startup fails if
# GEMINI_API_KEY or CORS_ALLOWED_ORIGINS is missing (validated in AppProperties).
app:
  gemini:
    required: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Behind the host's reverse proxy: Tomcat's RemoteIpValve reads X-Forwarded-For right to left,
# skipping trusted internal proxies, so a client cannot spoof its IP by sending the header itself
# (unlike trusting the leftmost value). Used for per-client rate limiting.
server:
  forward-headers-strategy: native
