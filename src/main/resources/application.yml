# Shared defaults. Profile files (application-{dev,test,prod}.yml) override these.
# Every secret or deployment-specific value comes from an environment variable.
spring:
  application:
    name: paris-compass
  profiles:
    default: dev
  # No defaults here: prod must supply all three. dev supplies local defaults.
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8081}

app:
  gemini:
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
    required: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  projection:
    cache-ttl: ${PROJECTION_CACHE_TTL:30d}
  rate-limit:
    projections-per-client-per-minute: ${RATE_LIMIT_PER_CLIENT_PER_MINUTE:5}
    projections-per-hour-global: ${RATE_LIMIT_GLOBAL_PER_HOUR:100}
  etl:
    run-on-startup: false
    exit-after-run: false
    force: false
    # Where each source is read from: https://, file: or classpath: locations.
    # Upstream files change over time; every run records the SHA-256 of what it ingested.
    sources:
      owid-co2: https://raw.githubusercontent.com/owid/co2-data/master/owid-co2-data.csv
      owid-energy: https://raw.githubusercontent.com/owid/energy-data/master/owid-energy-data.csv
      owid-temperature: https://ourworldindata.org/grapher/annual-temperature-anomalies.csv?v=1&csvType=full&useColumnShortNames=true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
