# Shared defaults. Profile files (application-{dev,test,prod}.yml) override these.
# Every secret or deployment-specific value comes from an environment variable.
spring:
  application:
    name: paris-compass
  profiles:
    default: dev
  # No defaults here: prod must supply all three. dev supplies local defaults.
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8081}

app:
  gemini:
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
    required: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
